[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/apply/"
  to = "/register/"
  status = 301

[[redirects]]
  from = "/attendee/"
  to = "/attendees/"
  status = 301
